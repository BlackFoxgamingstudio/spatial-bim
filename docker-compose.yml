version: "3.9"
# Sovereign Spatial BIM — docker-compose
# Usage: docker-compose up --build

services:
  spatial-bim:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sovereign-spatial-bim:latest
    container_name: sovereign-spatial-bim
    restart: unless-stopped
    ports:
      - "8780:8780"
    environment:
      SBB_IFC_SCHEMA_VERSION: ${SBB_IFC_SCHEMA_VERSION}
      SBB_CLASH_TOLERANCE_MM: ${SBB_CLASH_TOLERANCE_MM}
      SBB_MESH_LOD: ${SBB_MESH_LOD}
      SBB_AR_TARGET_PLATFORM: ${SBB_AR_TARGET_PLATFORM}
      SBB_API_KEY: ${SBB_API_KEY:-change-me}
      SBB_N8N_EVENT_BUS_URL: ${SBB_N8N_EVENT_BUS_URL:-http://host.docker.internal:5678/webhook/event-bus}
      SERVICE_PORT: 8780
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./.data:/app/.data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8780/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sbb-platform

networks:
  sbb-platform:
    external: true
    name: sbb-platform-network
